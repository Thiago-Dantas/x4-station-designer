[package]
name = "x4sd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "X4 station designer: CLI and MCP server (the builder follows)"

[dependencies]
x4sd-core = { path = "../x4sd-core" }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.5.1", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
schemars = "1.2.3"
