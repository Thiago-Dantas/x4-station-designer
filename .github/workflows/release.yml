# Pushing a tag vX.Y.Z builds x4sd.exe here, attests that this workflow built it from that commit,
# and publishes the release with the tag's message as its notes. Run by hand, it only builds (a check).
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write          # create the release
      id-token: write          # attestation signing certificate
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          $cargo = (Select-String -Path crates/x4sd/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content crates/x4sd/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$cargo" -ne $env:GITHUB_REF_NAME -or "v$tauri" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME, but Cargo.toml says $cargo and tauri.conf.json says $tauri"
          }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Rust stable
        run: rustup update stable --no-self-update && rustup default stable
      - run: npm --prefix ui ci
      - run: npm --prefix ui run build
      - run: cargo build -p x4sd --release --locked
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        if: github.ref_type == 'tag'
        with:
          subject-path: target/release/x4sd.exe
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # checkout turns an annotated tag into a lightweight one; fetch it again for its message
          git fetch --force origin "refs/tags/${env:GITHUB_REF_NAME}:refs/tags/${env:GITHUB_REF_NAME}"
          # the attestation bundle next to the exe, for offline checks (and Scorecard's Signed-Releases)
          Copy-Item $env:BUNDLE target/release/x4sd.exe.sigstore.json
          gh release create $env:GITHUB_REF_NAME target/release/x4sd.exe target/release/x4sd.exe.sigstore.json --verify-tag --notes-from-tag
